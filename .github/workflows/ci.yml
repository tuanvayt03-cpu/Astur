name: CI

# Gate on every push and PR, not only on tags. Before this existed the 21+ tests
# in the workspace never ran outside a developer's shell, and a broken `main` was
# discovered at release time.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the lockfile; the windows crate is the expensive part of a cold
      # build and it moves rarely.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Translation catalog contract
        run: python scripts/test_i18n_inventory.py

      - name: Preview packaging safety
        run: python scripts/test_preview_packaging.py

      - name: Notification diagnostics and click-blocker regression
        run: |
          python -m py_compile scripts/capture_notification_windows.py scripts/capture_zalo_popup_episodes.py scripts/capture_zalo_click_blocker.py
          python scripts/capture_zalo_click_blocker.py --self-test
          python scripts/capture_zalo_click_blocker.py --smoke

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Catches anything that only fails under LTO / codegen-units=1 /
      # panic=abort, which is what users actually run.
      - name: Build release
        run: cargo build --release --workspace

      # QA-only preview: no install, promotion, or release. Test only in a
      # disposable session without live MT5 or another Astur process.
      - name: Record pinned overlay QA provenance and SHA256
        if: github.head_ref == 'feat/astur-pinned-overlay-20261106' || github.head_ref == 'feat/astur-window-state-reconcile-20261107' || (github.event_name == 'push' && (github.ref == 'refs/heads/feat/astur-pinned-overlay-20261106' || github.ref == 'refs/heads/feat/astur-window-state-reconcile-20261107'))
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'target/release'
          foreach ($file in @('astur.exe','astur-settings.exe')) {
            $full = Join-Path $out $file
            if (-not (Test-Path $full -PathType Leaf)) { throw "Missing QA executable: $file" }
            if ((Get-Item $full).Length -eq 0) { throw "Empty QA executable: $file" }
          }
          @(
            "Commit: $env:GITHUB_SHA"
            "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "QA ONLY. No auto install or upgrade."
            "Only in a disposable desktop session without MT5/SignalOps or another Astur."
            "Read PINNED_OVERLAY_QA_ACCEPTANCE_20261106.md first."
          ) | Set-Content (Join-Path $out 'PINNED_OVERLAY_QA_BUILD_INFO.txt') -Encoding utf8
          @('astur.exe','astur-settings.exe') | ForEach-Object {
            $full = Join-Path $out $_
            $hash = (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$_"
          } | Set-Content (Join-Path $out 'PINNED_OVERLAY_SHA256SUMS.txt') -Encoding utf8

      - name: Upload pinned overlay portable QA bundle
        if: github.head_ref == 'feat/astur-pinned-overlay-20261106' || github.head_ref == 'feat/astur-window-state-reconcile-20261107' || (github.event_name == 'push' && (github.ref == 'refs/heads/feat/astur-pinned-overlay-20261106' || github.ref == 'refs/heads/feat/astur-window-state-reconcile-20261107'))
        uses: actions/upload-artifact@v4
        with:
          name: Astur-PinnedOverlay-QA-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/PINNED_OVERLAY_QA_BUILD_INFO.txt
            target/release/PINNED_OVERLAY_SHA256SUMS.txt
            docs/vi/PINNED_OVERLAY_QA_ACCEPTANCE_20261106.md
            docs/vi/PINNED_BACKGROUND_OVERLAY_IMPLEMENTATION_20261106.md
            docs/vi/WINDOW_TRACE_RECONCILE_HANDOFF_20261107.md
          if-no-files-found: error
          retention-days: 14

      # Portable QA binary for the cross-monitor/Telegram fix, not a release.
      # Never install/launch this on top of the user's active MT5 desktop.
      - name: Record cross-monitor Telegram preview provenance
        if: github.head_ref == 'fix/astur-cross-monitor-telegram-20261105' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/astur-cross-monitor-telegram-20261105')
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content target/release/CROSS_MONITOR_QA_BUILD_INFO.txt
          "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content target/release/CROSS_MONITOR_QA_BUILD_INFO.txt
          "QA ONLY: stop any running Astur before testing on disposable windows." | Add-Content target/release/CROSS_MONITOR_QA_BUILD_INFO.txt

      - name: Upload cross-monitor Telegram portable QA bundle
        if: github.head_ref == 'fix/astur-cross-monitor-telegram-20261105' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/astur-cross-monitor-telegram-20261105')
        uses: actions/upload-artifact@v4
        with:
          name: Astur-CrossMonitor-Telegram-Preview-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/CROSS_MONITOR_QA_BUILD_INFO.txt
            docs/vi/TELEGRAM_TASKBAR_CROSS_MONITOR_SLOT_20261105.md
          if-no-files-found: error
          retention-days: 14

      - name: Record slot-anchor preview provenance
        if: github.head_ref == 'feat/slot-anchor-placement-20261105' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/slot-anchor-placement-20261105')
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content target/release/SLOT_ANCHOR_BUILD_INFO.txt
          "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content target/release/SLOT_ANCHOR_BUILD_INFO.txt

      - name: Upload slot-anchor portable preview
        if: github.head_ref == 'feat/slot-anchor-placement-20261105' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/slot-anchor-placement-20261105')
        uses: actions/upload-artifact@v4
        with:
          name: Astur-SlotAnchor-Preview-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/SLOT_ANCHOR_BUILD_INFO.txt
            docs/vi/SLOT_ANCHOR_DRAG_TOP_2026-11-05.md
          if-no-files-found: error
          retention-days: 14

      # This is an explicit non-installer test artifact, not a GitHub Release.
      # Leave the user's installed window manager alone until the NCPC live
      # popup and mouse-input regression test proves the behavior.
      - name: Record NCPC test build provenance
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/zalo-notification-maximize-input' || github.ref == 'refs/heads/feat/native-titlebar-cross-monitor')
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content target/release/NCPC_BUILD_INFO.txt
          "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content target/release/NCPC_BUILD_INFO.txt

      - name: Upload NCPC Zalo popup test bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/zalo-notification-maximize-input' || github.ref == 'refs/heads/feat/native-titlebar-cross-monitor')
        uses: actions/upload-artifact@v4
        with:
          name: Astur-NCPC-NativeDrag-Preview-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/NCPC_BUILD_INFO.txt
            docs/vi/NCPC_TEST_BUILD_README.txt
            docs/vi/NCPC_ZALO_HWND_EVIDENCE_2026-11-03.md
          if-no-files-found: error
          retention-days: 14

      - name: Record Window Policy acceptance provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/window-policy-engine-v1-20261104'
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content target/release/WINDOW_POLICY_BUILD_INFO.txt
          "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content target/release/WINDOW_POLICY_BUILD_INFO.txt

      - name: Upload Window Policy portable acceptance bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/window-policy-engine-v1-20261104'
        uses: actions/upload-artifact@v4
        with:
          name: Astur-WindowPolicy-Preview-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/WINDOW_POLICY_BUILD_INFO.txt
            docs/vi/WINDOW_POLICY_ACCEPTANCE_README.txt
            docs/vi/WINDOW_POLICY_ENGINE_V1_2026-11-04.md
          if-no-files-found: error
          retention-days: 14
