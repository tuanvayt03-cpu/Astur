name: CI

# Gate on every push and PR, not only on tags. Before this existed the 21+ tests
# in the workspace never ran outside a developer's shell, and a broken `main` was
# discovered at release time.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the lockfile; the windows crate is the expensive part of a cold
      # build and it moves rarely.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Translation catalog contract
        run: python scripts/test_i18n_inventory.py

      - name: Preview packaging safety
        run: python scripts/test_preview_packaging.py

      - name: Notification diagnostics and click-blocker regression
        run: |
          python -m py_compile scripts/capture_notification_windows.py scripts/capture_zalo_popup_episodes.py scripts/capture_zalo_click_blocker.py
          python scripts/capture_zalo_click_blocker.py --self-test
          python scripts/capture_zalo_click_blocker.py --smoke

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Catches anything that only fails under LTO / codegen-units=1 /
      # panic=abort, which is what users actually run.
      - name: Build release
        run: cargo build --release --workspace

      # This is an explicit non-installer test artifact, not a GitHub Release.
      # Leave the user's installed window manager alone until the NCPC live
      # popup and mouse-input regression test proves the behavior.
      - name: Record NCPC test build provenance
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/zalo-notification-maximize-input' || github.ref == 'refs/heads/feat/native-titlebar-cross-monitor')
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content target/release/NCPC_BUILD_INFO.txt
          "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content target/release/NCPC_BUILD_INFO.txt

      - name: Upload NCPC Zalo popup test bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/zalo-notification-maximize-input' || github.ref == 'refs/heads/feat/native-titlebar-cross-monitor')
        uses: actions/upload-artifact@v4
        with:
          name: Astur-NCPC-NativeDrag-Preview-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/NCPC_BUILD_INFO.txt
            docs/vi/NCPC_TEST_BUILD_README.txt
            docs/vi/NCPC_ZALO_HWND_EVIDENCE_2026-11-03.md
          if-no-files-found: error
          retention-days: 14

      - name: Record Window Policy acceptance provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/window-policy-engine-v1-20261104'
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content target/release/WINDOW_POLICY_BUILD_INFO.txt
          "CI: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content target/release/WINDOW_POLICY_BUILD_INFO.txt

      - name: Upload Window Policy portable acceptance bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/window-policy-engine-v1-20261104'
        uses: actions/upload-artifact@v4
        with:
          name: Astur-WindowPolicy-Preview-${{ github.sha }}
          path: |
            target/release/astur.exe
            target/release/astur-settings.exe
            target/release/WINDOW_POLICY_BUILD_INFO.txt
            docs/vi/WINDOW_POLICY_ACCEPTANCE_README.txt
            docs/vi/WINDOW_POLICY_ENGINE_V1_2026-11-04.md
          if-no-files-found: error
          retention-days: 14
